services:
  app:
    build: .
    container_name: partyhud
    ports:
      # Por defecto solo esta máquina. APP_BIND=0.0.0.0 en .env lo abre a tu red local (OBS en otra PC).
      - "${APP_BIND:-127.0.0.1}:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # La BD vive en un volumen de Docker (sobrevive a reconstrucciones)
      DATABASE_URL: file:/app/data/app.db
    volumes:
      - partyhud-data:/app/data
    restart: unless-stopped

volumes:
  partyhud-data:
